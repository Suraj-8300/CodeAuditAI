[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codeauditai"
version = "1.2.0"
description = "Autonomous Multi-Agent Code Security & Performance Review Studio"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "CodeAuditAI Team"}
]
keywords = [
    "security",
    "code-audit",
    "multi-agent",
    "owasp",
    "cwe",
    "performance",
    "sarif",
    "langgraph",
    "polyglot"
]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "httpx>=0.24.0",
    "langchain>=0.1.0",
    "langgraph>=0.0.20",
    "chromadb>=0.4.0",
    "python-dotenv>=1.0.0",
    "langchain-text-splitters>=0.0.1",
    "langchain-google-genai>=0.0.5",
    "pydantic>=2.0.0",
    "rich>=13.0.0"
]

[project.scripts]
codeaudit = "app.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

